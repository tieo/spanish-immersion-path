<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanish</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --line: #262a36; --text: #e6e8ef; --muted: #8a90a2;
    --accent: #7aa2ff; --good: #3fb27f; --warn: #e3c14d; --bad: #e0644f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 Inter, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 48px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); border-radius: 10px; padding: 10px 14px; }
  button:disabled { opacity: .35; cursor: default; }
  a.button { display: block; text-align: center; text-decoration: none; font-weight: 650;
    border-radius: 10px; padding: 10px 14px; }
  button.primary, a.button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d13; font-weight: 650; }
  .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .status div { background: var(--panel); border-radius: 10px; padding: 9px 11px; }
  .status b { display: block; font-size: 19px; font-weight: 650; }
  .status span { color: var(--muted); font-size: 12.5px; }
  .modes { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
  .modes button { flex: 1 0 auto; padding: 8px 12px; font-size: 14.5px; }
  .modes button.on { border-color: var(--accent); color: var(--accent); }
  .card { background: var(--panel); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #000; }
  .card .body { padding: 12px 14px 14px; }
  .card h2 { font-size: 18px; margin: 0 0 4px; font-weight: 650; }
  .card .meta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .card .actions { display: flex; gap: 8px; margin-top: 12px; }
  .card .actions button { flex: 1; }
  .alt { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center;
    background: var(--panel); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .alt img { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; display: block; }
  .alt b { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .alt span { color: var(--muted); font-size: 12.5px; }
  .anki-card { padding: 18px 14px; }
  .anki-card h2 { margin: 0 0 6px; }
  .rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .rate button.on { border-color: var(--accent); color: var(--accent); }
  .toggle { margin-top: 8px; display: flex; gap: 8px; }
  .toggle button.on { border-color: var(--bad); color: var(--bad); }
  textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font: inherit; min-height: 84px; margin-top: 10px; }
  .words { display: flex; flex-wrap: wrap; gap: 8px; }
  .words button { padding: 8px 12px; }
  .lvl { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .lvl i { display: block; height: 100%; background: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: s 0.8s linear infinite; margin: 30px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main id="app"><div class="spin"></div></main>
<script>
const LEVELS = ["superbeginner", "beginner", "intermediate", "advanced"];
const MODE_NAMES = { best: "Best now", audio: "Audio only", relax: "Relax", read: "Read", talk: "Talk" };
const app = document.getElementById("app");
let state = null, mode = localStorage.getItem("sip:mode") || "best";

const api = (path, body) => fetch(path, body === undefined ? {} :
  { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
  .then(r => r.json());
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const levelName = l => LEVELS[Math.max(0, Math.min(3, Math.round(l)))];
const minutes = s => Math.round((s || 0) / 60) + " min";
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const watch = id => `https://www.youtube.com/watch?v=${id}`;
const busy = () => { app.innerHTML = '<div class="spin"></div>'; };

async function load() {
  state = await api("/api/state");
  if (state.open) return inProgress(state.open);
  return home();
}

function statusBar() {
  const pct = Math.max(3, Math.min(100, (state.level + 0.5) / 4 * 100));
  return `<div class="status">
    <div><b>${levelName(state.level)}</b><span>${state.level.toFixed(2)}</span><div class="lvl"><i style="width:${pct}%"></i></div></div>
    <div><b>${(state.seconds / 3600).toFixed(1)} h</b><span>${state.units_done} units</span></div>
    <div><b>${state.anki.due} · ${state.anki.new}</b><span>Anki due · new</span></div>
  </div>`;
}

function modeBar() {
  return `<div class="modes">${Object.keys(MODE_NAMES).map(m =>
    `<button data-mode="${m}" class="${m === mode ? "on" : ""}" ${state.modes[m] ? "" : "disabled"}>${MODE_NAMES[m]}</button>`
  ).join("")}</div>`;
}

async function home() {
  app.innerHTML = statusBar() + modeBar() + '<div id="next"><div class="spin"></div></div>';
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    mode = b.dataset.mode; localStorage.setItem("sip:mode", mode); home(); });
  const res = await api(`/api/next?mode=${mode}`);
  const box = document.getElementById("next");
  if (!res.options.length) { box.innerHTML = '<div class="empty">Nothing here yet</div>'; return; }
  const [first, ...rest] = res.options;
  box.innerHTML = "";
  box.append(h(primaryCard(first)));
  rest.forEach(o => box.append(h(altCard(o))));
  box.querySelectorAll("[data-start]").forEach((b, i) => b.onclick = () => startUnit(res.options[i]));
}

function videoMeta(o) {
  return `<span>${esc(o.channel)}</span><span>${minutes(o.duration)}</span><span>${levelName(o.level)}</span>` +
    (o.new_words ? `<span>${o.new_words} new words</span>` : "");
}

function primaryCard(o) {
  if (o.kind === "talk") return `<div class="card anki-card"><h2>Hablar</h2>
    <div class="meta"><span>Claude</span><span>${levelName(o.level)}</span></div>
    <div class="actions"><a class="button primary" href="https://claude.ai/new" target="_blank">Start</a></div></div>`;
  if (o.kind === "anki") return `<div class="card anki-card"><h2>Anki</h2>
    <div class="meta"><span>${o.due} due</span><span>${o.new} new</span></div>
    <div class="actions"><button class="primary" data-start>Start</button></div></div>`;
  return `<div class="card"><img src="${thumb(o.id)}" alt="">
    <div class="body"><h2>${esc(o.title)}</h2><div class="meta">${videoMeta(o)}</div>
    <div class="actions"><button class="primary" data-start>Start</button></div></div></div>`;
}

function altCard(o) {
  if (o.kind === "anki") return `<div class="alt"><div></div><div><b>Anki</b><span>${o.due} due · ${o.new} new</span>
    <div><button data-start>Start</button></div></div></div>`;
  return `<div class="alt"><img src="${thumb(o.id)}" alt="">
    <div><b>${esc(o.title)}</b><span>${esc(o.channel)} · ${minutes(o.duration)}</span>
    <div style="margin-top:6px"><button data-start>Start</button></div></div></div>`;
}

async function startUnit(o) {
  const unit = o.kind === "video" ? o.id : o.kind;
  if (o.kind === "video") window.open(watch(o.id), "_blank");
  const { entry } = await api("/api/start", { unit, kind: o.kind, mode });
  state.open = { ...o, id: entry, unit, kind: o.kind };
  inProgress(state.open);
}

// A unit in progress: the learner comes back, rates it and finishes it.
function inProgress(o) {
  const head = o.kind === "video"
    ? `<img src="${thumb(o.unit)}" alt=""><div class="body"><h2>${esc(o.title)}</h2><div class="meta">${videoMeta(o)}</div>`
    : `<div class="body"><h2>Anki</h2>`;
  app.innerHTML = statusBar() + `<div class="card">${head}
    ${o.kind === "video" ? `<div class="actions"><button id="open">Open video</button></div>` : ""}
    <div class="rate">${["easy", "right", "hard"].map(r =>
      `<button data-rate="${r}">${{ easy: "Easy", right: "Just right", hard: "Hard" }[r]}</button>`).join("")}</div>
    <div class="toggle"><button id="boring">Boring</button></div>
    <textarea id="note" placeholder="Note"></textarea>
    <div class="actions"><button id="drop">Skip</button><button class="primary" id="done" disabled>Done</button></div>
    </div></div>`;
  let rating = null, boring = false;
  const done = document.getElementById("done");
  if (o.kind !== "video") { rating = "right"; done.disabled = false; app.querySelector(".rate").hidden = true; }
  app.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => {
    rating = b.dataset.rate; done.disabled = false;
    app.querySelectorAll("[data-rate]").forEach(x => x.classList.toggle("on", x === b)); });
  document.getElementById("boring").onclick = e => { boring = !boring; e.target.classList.toggle("on", boring); };
  const openBtn = document.getElementById("open");
  if (openBtn) openBtn.onclick = () => window.open(watch(o.unit), "_blank");
  document.getElementById("drop").onclick = async () => { busy(); await api("/api/abandon", { entry: o.id }); load(); };
  done.onclick = async () => {
    const note = document.getElementById("note").value;
    busy();
    const res = await api("/api/finish", { entry: o.id, rating, boring, note });
    if (res.words && res.words.length) return wordsAdded(res.words);
    load();
  };
}

function wordsAdded(words) {
  app.innerHTML = `<div class="card"><div class="body"><h2>+${words.length} Anki</h2>
    <div class="words" style="margin-top:10px">${words.map(w => `<button disabled>${esc(w.split("|")[0])}</button>`).join("")}</div>
    <div class="actions"><button class="primary" id="ok">Next</button></div></div></div>`;
  document.getElementById("ok").onclick = load;
}

load();
</script>
</body>
</html>
