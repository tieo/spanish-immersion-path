<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Español</title>
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --line: #262a36; --text: #e6e8ef; --muted: #8a90a2;
    --accent: #7aa2ff; --good: #3fb27f; --bad: #e0644f;
    /* Categorical slots 1-3 of the validated dark palette: unit kinds. */
    --k-video: #3987e5; --k-anki: #d95926; --k-talk: #199e70; --k-type: #a46bd6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 Inter, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 96px; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); border-radius: 10px; padding: 10px 14px; }
  button:disabled { opacity: .35; cursor: default; }
  a.button { display: block; flex: 1; text-align: center; text-decoration: none; border-radius: 10px; padding: 10px 14px; }
  button.primary, a.button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d13; font-weight: 650; }
  h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
    margin: 22px 2px 8px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .tiles.top { grid-template-columns: 1.3fr 1fr 1.2fr; }
  .tiles.top .tile b { font-size: 18px; }
  .tiles.top .tile span { white-space: nowrap; }
  .card .tile { background: var(--bg); }
  a.tile.link { color: inherit; text-decoration: none; }
  a.tile.link:active { background: #1d2333; }
  .tile b small.go { font-size: 14px; font-weight: 500; color: var(--accent); }
  .tile { background: var(--panel); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile b { display: block; font-size: 20px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile span { color: var(--muted); font-size: 12.5px; }
  .tile b.name { font-size: 18px; line-height: 25px; }
  .tile b.name small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .lvl { position: relative; height: 6px; background: var(--line); border-radius: 3px; margin-top: 7px; }
  .lvl i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; }
  .modes { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
  .modes button { flex: 1 0 auto; padding: 8px 12px; font-size: 14.5px; }
  .modes button.on { border-color: var(--accent); color: var(--accent); }
  .card { background: var(--panel); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .thumb { position: relative; }
  .thumb img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #000; }
  .thumb em { position: absolute; right: 8px; bottom: 8px; background: #000c; color: #fff; font-style: normal;
    font-size: 12.5px; font-weight: 600; padding: 2px 6px; border-radius: 5px; }
  .card .body { padding: 12px 14px 14px; }
  .card h2 { font-size: 18px; margin: 0 0 6px; font-weight: 650; line-height: 1.3; }
  .meta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .chip { display: inline-block; font-size: 12.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .fit { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin-top: 12px;
    font-size: 13px; color: var(--muted); }
  .fit .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .fit .bar i { display: block; height: 100%; background: var(--good); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; }
  .alt { display: grid; grid-template-columns: 112px 1fr auto; gap: 10px; align-items: center;
    background: var(--panel); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .alt img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; display: block; }
  .alt b { font-size: 14px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .alt span { color: var(--muted); font-size: 12.5px; }
  .plain { padding: 16px 14px; }
  .plain h2 { margin: 0 0 6px; }
  .rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .rate button { border-color: var(--accent); color: var(--accent); font-weight: 600; padding: 12px 6px; }
  .toggle { margin-top: 10px; display: flex; gap: 8px; align-items: stretch; }
  .toggle textarea { margin-top: 0; min-height: 0; flex: 1; resize: vertical; }
  button.quiet { border-color: transparent; background: none; color: var(--muted); }
  .toggle button.on { border-color: var(--bad); color: var(--bad); }
  textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; font: inherit; min-height: 70px; margin-top: 10px; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .words span { padding: 4px 10px; border-radius: 8px; background: var(--bg); font-size: 14.5px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: s 0.8s linear infinite; margin: 30px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: #0f1117f2; border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(6px); }
  nav button { flex: 0 1 320px; border: 0; border-radius: 0; background: none; padding: 14px 0 12px;
    color: var(--muted); font-weight: 600; }
  nav button.on { color: var(--text); box-shadow: inset 0 2px 0 var(--accent); }
  .chart { background: var(--panel); border-radius: 12px; padding: 10px 10px 6px; position: relative; }
  .chart svg { display: block; width: 100%; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); padding: 2px 4px 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .tip { position: absolute; pointer-events: none; background: #0b0d13f0; border: 1px solid #333a4d;
    border-radius: 8px; padding: 6px 8px; font-size: 12.5px; opacity: 0; white-space: nowrap; }
  .list { background: var(--panel); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line);
    align-items: center; }
  .row:first-child { border-top: 0; }
  .row > div { min-width: 0; }
  .row b { font-weight: 500; font-size: 14.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row span { color: var(--muted); font-size: 12.5px; }
  .rating { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .rating.easy { color: var(--good); border-color: #2b5a45; }
  .rating.hard { color: var(--bad); border-color: #6a3329; }
  #net { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 9; font-size: 13px;
    background: #2a2030; color: #f0b27a; border: 1px solid #5a3d2a; border-radius: 999px; padding: 4px 12px; }
  #net::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%;
    border: 2px solid #f0b27a; border-top-color: transparent; animation: s 0.8s linear infinite; vertical-align: -1px; }
  .tiles.checking .tile b { opacity: .45; }
  .dict { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; margin: 14px 0 4px; }
  .dict button { width: 64px; height: 64px; border-radius: 50%; font-size: 22px; padding: 0;
    border-color: var(--accent); color: var(--accent); }
  .dict span { color: var(--muted); font-size: 15px; }
  input.typed { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; font: inherit; font-size: 22px; margin-top: 10px; }
  .answer { font-size: 30px; font-weight: 650; margin: 16px 0 2px; letter-spacing: .01em; }
  .answer.right { color: var(--good); }
  .answer u { color: var(--bad); text-decoration-thickness: 2px; }
  .answer + span, .wrong { color: var(--muted); font-size: 15px; }
  .wrong s { color: var(--bad); }
</style>
</head>
<body>
<div id="net" hidden>Reconnecting</div>
<main id="app"><div class="spin"></div></main>
<nav><button data-tab="next">Next</button><button data-tab="stats">Stats</button></nav>
<script>
// The internal score puts the typical Dreaming Spanish superbeginner, beginner,
// intermediate and advanced video at 0, 1, 2 and 3; shown on the CEFR scale by the usual
// equivalence (superbeginner A1 ... advanced B2), each band halved into sub-levels as the
// Instituto Cervantes does (A1.1, A1.2). The same mapping is cefr() in catalog.py.
const CEFR = ["A1", "A2", "B1", "B2", "C1", "C2"];
const BAND_START = -0.5, SUB = 0.5;
const MODE_NAMES = { best: "Best now", audio: "Audio only", relax: "Relax", read: "Read", talk: "Talk", type: "Type" };
const KINDS = [["video", "Video", "var(--k-video)"], ["anki", "Anki", "var(--k-anki)"], ["talk", "Talk", "var(--k-talk)"],
  ["type", "Type", "var(--k-type)"]];
const RATINGS = { easy: "Easy", right: "Just right", hard: "Hard" };
// Voice assistants for the talk unit; the link opens the app on a phone.
const VOICE = { gemini: { name: "Gemini Live", url: "https://gemini.google.com/app" },
  chatgpt: { name: "ChatGPT", url: "https://chatgpt.com/" } };
let talkPrompt = "";
// AnkiDroid opens from a tap on Android through the one link it accepts from a browser,
// its card browser (Chrome launches no app screen that is not marked for browser links,
// so a link to the deck list falls back to the web); elsewhere AnkiWeb takes its place.
const ANDROID = /Android/i.test(navigator.userAgent);
const ANKI_URL = ANDROID ? "anki://x-callback-url/browser" : "https://ankiweb.net/decks";
function openAnki() { ANDROID ? (location.href = ANKI_URL) : window.open(ANKI_URL, "_blank"); }
// The assistant used last comes first, as the primary action.
const voiceOrder = () => { const last = localStorage.getItem("sip:voice");
  return Object.keys(VOICE).sort((a, b) => (b === last) - (a === last)); };
const app = document.getElementById("app");
let state = null, mode = localStorage.getItem("sip:mode") || "best", tab = "next";

// A request that hangs (a stalled connection on the way) is cut off and sent again; the
// connection badge shows while it retries.
const TIMEOUT = 12000;
let retrying = 0;
const net = document.getElementById("net");
async function api(path, body) {
  for (let attempt = 0; ; attempt++) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), TIMEOUT);
    try {
      const r = await fetch(path, { signal: ctl.signal, cache: "no-store", ...(body === undefined ? {} :
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }) });
      const data = await r.json();
      if (attempt) net.hidden = --retrying === 0;
      return data;
    } catch (e) {
      if (!attempt) { retrying++; net.hidden = false; }
      await new Promise(ok => setTimeout(ok, Math.min(8000, 1000 * 2 ** attempt)));
    } finally { clearTimeout(timer); }
  }
}
const h = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function cefr(score) {
  if (score < BAND_START) return "Pre-A1";
  const x = score - BAND_START, band = Math.floor(x);
  if (band >= 5) return "C2";
  return CEFR[band] + (x - band < SUB ? ".1" : ".2");
}
// The middle of a CEFR level on the score scale, as score_of() in catalog.py.
function scoreOf(code) {
  const m = /^\s*(pre-?a1|[abc][12])(?:\.([12]))?\s*$/i.exec(code || "");
  if (!m) return null;
  const name = m[1].toUpperCase();
  if (name.startsWith("PRE")) return BAND_START - 0.25;
  const band = CEFR.indexOf(name);
  if (name === "C2") return BAND_START + band + 0.25;
  return BAND_START + band + (m[2] === "1" ? 0.25 : m[2] === "2" ? 0.75 : 0.5);
}
// How far the score is through its half level, 0..1; Pre-A1 counts as the half level
// below A1.1, C2 as complete.
function subProgress(score) {
  if (score >= BAND_START + 5) return 1;
  const x = (score - (BAND_START - SUB)) / SUB;
  return x < 0 ? 0 : x - Math.floor(x);
}
const mins = s => Math.round((s || 0) / 60);
// Time in a top tile: minutes up to an hour, then hours with one decimal.
const short = s => mins(s) < 60 ? `${mins(s)} min` : `${(s / 3600).toFixed(1)} h`;
const duration = s => { const m = mins(s); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const watch = id => `https://www.youtube.com/watch?v=${id}`;
const busy = () => { app.innerHTML = '<div class="spin"></div>'; };
const shortDate = (d, opts = { day: "numeric", month: "short" }) => new Date(d).toLocaleDateString(undefined, opts);

document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; load(); });

async function load() {
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  busy();
  if (tab === "stats") return statsView();
  state = await api("/api/state");
  if (state.open) return inProgress(state.open);
  return home();
}

// The half level and exactly how far into it the learner is.
function levelTile(level) {
  const p = subProgress(level), now = cefr(level);
  const next = now === "C2" ? "" : cefr(level + SUB * (1 - p) + 0.001);
  return `<div class="tile"><b class="name">${now} <small>${Math.round(p * 100)}%</small></b>
    <span>${next ? `→ ${next}` : ""}</span><div class="lvl"><i style="width:${Math.max(2, p * 100)}%"></i></div></div>`;
}

function statusBar() {
  return `<div class="tiles top">${levelTile(state.level)}
    <div class="tile"><b>${short(state.today_seconds)}</b><span>today${state.streak ? ` · ${state.streak} d` : ""}</span></div>
    <a class="tile link" id="anki-tile" href="${ANKI_URL}" target="${ANDROID ? "_self" : "_blank"}">
      <b>${state.anki.due} · ${state.anki.new} <small class="go">↗</small></b><span>Anki due · new</span></a></div>`;
}

function modeBar() {
  return `<div class="modes">${Object.keys(MODE_NAMES).map(m =>
    `<button data-mode="${m}" class="${m === mode ? "on" : ""}" ${state.modes[m] ? "" : "disabled"}>${MODE_NAMES[m]}</button>`
  ).join("")}</div>`;
}

async function home() {
  app.innerHTML = statusBar() + modeBar() + '<div id="next"><div class="spin"></div></div>';
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    mode = b.dataset.mode; localStorage.setItem("sip:mode", mode); home(); });
  const res = await api(`/api/next?mode=${mode}`);
  const box = document.getElementById("next");
  if (!res.options.length) { box.innerHTML = '<div class="empty">Nothing here yet</div>'; return; }
  const [first, ...rest] = res.options;
  box.innerHTML = "";
  box.append(h(primaryCard(first)));
  rest.forEach(o => box.append(h(altCard(o))));
  box.querySelectorAll("[data-start]").forEach((b, i) => b.onclick = () => startUnit(res.options[i]));
  if (first.kind === "talk") {
    talkPrompt = (await api("/api/talk/prompt")).prompt;
    box.querySelectorAll("[data-voice]").forEach(b => b.onclick = () => startTalk(b.dataset.voice));
  }
}

// Copy the prompt and open the assistant inside the tap, which browsers require for both.
async function startTalk(voice) {
  window.open(VOICE[voice].url, "_blank");
  localStorage.setItem("sip:voice", voice);
  navigator.clipboard.writeText(talkPrompt).catch(() => {});
  const { entry } = await api("/api/start", { unit: "talk", kind: "talk", mode: voice });
  state.open = { id: entry, unit: "talk", kind: "talk", mode: voice };
  inProgress(state.open);
}

function fit(o) {
  if (o.coverage === undefined) return "";
  const pct = Math.round(o.coverage * 100);
  return `<div class="fit"><span>${pct}% known</span><div class="bar"><i style="width:${pct}%"></i></div>
    <span>+${o.new_words} words</span></div>`;
}

function videoHead(o, id) {
  return `<div class="thumb"><img src="${thumb(id)}" alt=""><em>${duration(o.duration)}</em></div>
    <div class="body"><h2>${esc(o.title)}</h2>
    <div class="meta"><span>${esc(o.channel)}</span><span class="chip">${cefr(o.level)}</span>
    ${o.audio ? '<span class="chip">audio ok</span>' : ""}</div>`;
}

function primaryCard(o) {
  if (o.kind === "talk") return `<div class="card plain"><h2>Hablar</h2>
    <div class="meta"><span class="chip">${cefr(o.level)}</span>${state.learning_now.length ? `<span>${state.learning_now.length} words to use</span>` : ""}</div>
    ${state.learning_now.length ? `<div class="words">${state.learning_now.map(w => `<span>${esc(w)}</span>`).join("")}</div>` : ""}
    <div class="actions">${voiceOrder().map((k, i) => `<button class="${i ? "" : "primary"}" data-voice="${k}">${VOICE[k].name}</button>`).join("")}</div></div>`;
  if (o.kind === "type") return `<div class="card plain"><h2>Escribir</h2>
    <div class="meta"><span>${o.words.length} words you are learning</span></div>
    <div class="actions"><button class="primary" data-start>Start</button></div></div>`;
  if (o.kind === "anki") return `<div class="card plain"><h2>Anki</h2>
    <div class="meta"><span>${o.due} due</span><span>${o.new} new</span></div>
    <div class="actions"><button class="primary" data-start>Start</button></div></div>`;
  return `<div class="card">${videoHead(o, o.id)}${fit(o)}
    <div class="actions"><button class="primary" data-start>Start</button></div></div></div>`;
}

function altCard(o) {
  if (o.kind === "anki") return `<div class="alt"><div></div><div><b>Anki</b><span>${o.due} due · ${o.new} new</span></div>
    <button data-start>Start</button></div>`;
  return `<div class="alt"><img src="${thumb(o.id)}" alt="">
    <div><b>${esc(o.title)}</b><span>${duration(o.duration)} · ${cefr(o.level)} · ${Math.round(o.coverage * 100)}% known</span></div>
    <button data-start>Start</button></div>`;
}

async function startUnit(o) {
  const unit = o.kind === "video" ? o.id : o.kind;
  if (o.kind === "video") window.open(watch(o.id), "_blank");
  if (o.kind === "anki") openAnki();
  const { entry } = await api("/api/start", { unit, kind: o.kind, mode });
  state.open = { ...o, id: entry, unit, kind: o.kind };
  inProgress(state.open);
}

const ARTICLE = /^(el\/la|los\/las|el|la|los|las) /;
const bare = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const typedForm = s => s.trim().toLowerCase().replace(/\s+/g, " ").replace(ARTICLE, "");

// The correct word with the letters the learner missed or got wrong underlined, from an
// edit-distance alignment of what they typed against it.
function marked(typed, word) {
  const a = [...typed], b = [...word.toLowerCase()], shown = [...word];
  const d = Array.from({ length: a.length + 1 }, (_, i) => Array.from({ length: b.length + 1 }, (_, j) => i + j));
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  const wrong = new Set();
  let i = a.length, j = b.length;
  while (j > 0) {
    if (i > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) {
      if (a[i - 1] !== b[j - 1]) wrong.add(j - 1);
      i--; j--;
    } else if (i > 0 && d[i][j] === d[i - 1][j] + 1) i--;
    else { wrong.add(j - 1); j--; }
  }
  return shown.map((c, k) => wrong.has(k) ? `<u>${esc(c)}</u>` : esc(c)).join("");
}

// Dictation of words the learner is learning: hear the card's recording, type the word,
// see which letters were wrong. Accents count, the article is optional.
async function typeInProgress(o) {
  if (!o.words) {
    const res = await api("/api/next?mode=type");
    o.words = (res.options[0] || {}).words || [];
  }
  const words = o.words, results = [];
  let i = 0, sound = null;
  const finish = async () => {
    busy();
    if (!results.length) { await api("/api/abandon", { entry: o.id }); return load(); }
    await api("/api/finish", { entry: o.id, results });
    typeSummary(results);
  };
  const play = () => { sound && sound.pause(); sound = new Audio(`/media/${encodeURIComponent(words[i].audio)}`); sound.play().catch(() => {}); };
  const ask = () => {
    const w = words[i];
    app.innerHTML = statusBar() + `<div class="card plain"><div class="meta"><span>Escribir</span><span>${i + 1} / ${words.length}</span></div>
      <div class="dict"><button id="play">▶</button><span>${esc(w.meaning)}</span></div>
      <input class="typed" id="typed" lang="es" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <div class="actions"><button class="primary" id="check">Check</button></div>
      <div class="actions"><button id="stop" class="quiet">Stop</button></div></div>`;
    const input = document.getElementById("typed");
    document.getElementById("play").onclick = () => { play(); input.focus(); };
    document.getElementById("stop").onclick = finish;
    document.getElementById("check").onclick = () => check(input.value);
    // Without preventDefault the same Enter would also press the Next button check() focuses.
    input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); check(input.value); } };
    input.focus();
    play();
  };
  const check = value => {
    const w = words[i], head = w.word.replace(ARTICLE, ""), typed = typedForm(value);
    const correct = typed === head.toLowerCase();
    results.push({ note: w.note, word: w.word, typed, correct });
    const article = w.word.slice(0, w.word.length - head.length);
    app.querySelector(".card").innerHTML = `<div class="meta"><span>Escribir</span><span>${i + 1} / ${words.length}</span></div>
      <div class="answer ${correct ? "right" : ""}">${correct ? esc(w.word) : esc(article) + marked(typed, head)}</div>
      <span>${esc(w.ipa)}${w.ipa ? " · " : ""}${esc(w.meaning)}</span>
      ${correct ? "" : `<div class="wrong">${typed ? `<s>${esc(typed)}</s>` : "–"}${typed && bare(typed) === bare(head.toLowerCase()) ? " · accent" : ""}</div>`}
      <div class="actions"><button id="replay" style="flex:0 0 64px">▶</button><button class="primary" id="next">${i + 1 < words.length ? "Next" : "Finish"}</button></div>`;
    document.getElementById("replay").onclick = play;
    const next = document.getElementById("next");
    next.onclick = () => { i++; i < words.length ? ask() : finish(); };
    next.focus();
  };
  ask();
}

function typeSummary(results) {
  const right = results.filter(r => r.correct).length, missed = results.filter(r => !r.correct);
  app.innerHTML = `<div class="card plain"><h2>Escribir</h2>
    <div class="tiles" style="margin:10px 0 0"><div class="tile"><b>${right} / ${results.length}</b><span>right</span></div></div>
    ${missed.length ? `<div class="words">${missed.map(r => `<span>${esc(r.word)}</span>`).join("")}</div>` : ""}
    <div class="actions"><button class="primary" id="ok">Next</button></div></div>`;
  document.getElementById("ok").onclick = load;
}

// A unit in progress: the learner comes back, marks it boring or leaves a note if they
// want, and finishes it with the rating, one tap.
function inProgress(o) {
  if (o.kind === "talk") return talkInProgress(o);
  if (o.kind === "anki") return ankiInProgress(o);
  if (o.kind === "type") return typeInProgress(o);
  const head = o.kind === "video" ? videoHead(o, o.unit) : `<div class="body"><h2>Anki</h2>`;
  const reopen = o.kind === "video" ? `<div class="actions"><button id="open">Open video</button></div>`
    : `<div class="actions"><button id="open">Open Anki</button></div>`;
  const finish = o.kind === "video"
    ? `<div class="rate">${Object.entries(RATINGS).map(([r, label]) => `<button data-rate="${r}">${label}</button>`).join("")}</div>`
    : `<div class="actions"><button class="primary" data-rate="right">Done</button></div>`;
  app.innerHTML = statusBar() + `<div class="card">${head}
    ${reopen}
    <div class="toggle"><button id="boring">Boring</button><textarea id="note" placeholder="Note" rows="1"></textarea></div>
    ${finish}
    <div class="actions"><button id="drop" class="quiet">Skip</button></div>
    </div></div>`;
  let boring = false;
  document.getElementById("boring").onclick = e => { boring = !boring; e.target.classList.toggle("on", boring); };
  const openBtn = document.getElementById("open");
  if (openBtn) openBtn.onclick = () => o.kind === "video" ? window.open(watch(o.unit), "_blank") : openAnki();
  document.getElementById("drop").onclick = async () => { busy(); await api("/api/abandon", { entry: o.id }); load(); };
  app.querySelectorAll("[data-rate]").forEach(b => b.onclick = async () => {
    const note = document.getElementById("note").value;
    busy();
    const res = await api("/api/finish", { entry: o.id, rating: b.dataset.rate, boring, note });
    if (res.words && res.words.length) return wordsAdded(res.words);
    load();
  });
}

// An Anki session in progress: AnkiDroid is where it happens. Each time the learner comes
// back to the app, it reads from AnkiWeb what they did, and finishes the unit itself once
// nothing is left to study; Done finishes it earlier.
function ankiInProgress(o) {
  const tile = (v, label) => `<div class="tile"><b>${v}</b><span>${label}</span></div>`;
  const tiles = p => `${tile(p.reviews ?? "–", "reviewed")}${tile(p.due, "due")}${tile(p.new, "new")}`;
  app.innerHTML = statusBar() + `<div class="card plain"><h2>Anki</h2>
    <div class="tiles checking" id="progress" style="margin:10px 0 0">${tiles(state.anki)}</div>
    <div class="actions"><button class="primary" id="open">Open Anki</button></div>
    <div class="actions"><button id="done">Done</button></div>
    <div class="actions"><button id="drop" class="quiet">Skip</button></div></div>`;
  let finished = false, checking = false;
  const finish = async () => {
    if (finished) return;
    finished = true;
    document.removeEventListener("visibilitychange", onShow);
    busy();
    const res = await api("/api/finish", { entry: o.id, rating: "right" });
    // A retried finish whose first try went through finds no unit open any more.
    if (res.error) return load();
    const a = res.anki || {};
    app.innerHTML = `<div class="card plain"><h2>Anki</h2>
      <div class="tiles" style="margin:10px 0 0">${tile(a.reviews ?? 0, "reviewed")}${tile(mins(a.seconds) + " min", "in Anki")}${tile((a.due ?? 0) + (a.new ?? 0), "left")}</div>
      <div class="actions"><button class="primary" id="ok">Next</button></div></div>`;
    document.getElementById("ok").onclick = load;
  };
  const check = async () => {
    if (checking || finished || document.hidden) return;
    checking = true;
    const box = document.getElementById("progress");
    box && box.classList.add("checking");
    const p = await api("/api/anki/progress");
    checking = false;
    if (finished || !document.getElementById("progress")) return;
    if (p.error) return load();
    box.innerHTML = tiles(p);
    box.classList.remove("checking");
    if (p.reviews > 0 && p.due === 0 && p.new === 0) finish();
  };
  const onShow = () => { if (!document.getElementById("progress")) document.removeEventListener("visibilitychange", onShow); else check(); };
  document.addEventListener("visibilitychange", onShow);
  document.getElementById("open").onclick = openAnki;
  document.getElementById("drop").onclick = async () => { finished = true; busy(); await api("/api/abandon", { entry: o.id }); load(); };
  document.getElementById("done").onclick = finish;
  check();
}

// A conversation in progress: back from the assistant, the learner pastes its result.
async function talkInProgress(o) {
  const v = VOICE[o.mode] || VOICE.gemini;
  if (!talkPrompt) talkPrompt = (await api("/api/talk/prompt")).prompt;
  app.innerHTML = statusBar() + `<div class="card plain"><h2>Hablar</h2>
    <div class="meta"><span>${v.name}</span></div>
    <div class="actions"><button id="open">Open ${v.name}</button><button id="copy">Copy prompt</button></div>
    <textarea id="result" rows="6" placeholder="RESULT&#10;comprehension: …&#10;production: …&#10;minutes: …&#10;errors: …"></textarea>
    <div class="actions"><button class="primary" id="save">Save</button></div>
    <div class="actions"><button id="drop" class="quiet">Skip</button></div></div>`;
  document.getElementById("open").onclick = () => window.open(v.url, "_blank");
  document.getElementById("copy").onclick = e => navigator.clipboard.writeText(talkPrompt)
    .then(() => { e.target.textContent = "Copied ✓"; }).catch(() => {});
  document.getElementById("drop").onclick = async () => { busy(); await api("/api/abandon", { entry: o.id }); load(); };
  document.getElementById("save").onclick = async () => {
    const result = document.getElementById("result").value;
    busy();
    const res = await api("/api/finish", { entry: o.id, result });
    if (res.error) return load();
    talkResult(res);
  };
}

function talkResult(res) {
  const r = res.result || {};
  const tile = (v, label) => `<div class="tile"><b>${esc(v || "–")}</b><span>${label}</span></div>`;
  app.innerHTML = `<div class="card plain"><h2>Hablar</h2>
    <div class="tiles" style="margin:10px 0 0">${tile(r.comprehension, "comprehension")}${tile(r.production, "production")}${tile(cefr(res.level), "your level now")}</div>
    ${r.errors && r.errors.length ? `<div class="words">${r.errors.map(e => `<span>${esc(e)}</span>`).join("")}</div>` : ""}
    <div class="actions"><button class="primary" id="ok">Next</button></div></div>`;
  document.getElementById("ok").onclick = load;
}

function wordsAdded(words) {
  app.innerHTML = `<div class="card plain"><h2>+${words.length} Anki</h2>
    <div class="words">${words.map(w => `<span>${esc(w.split("|")[0])}</span>`).join("")}</div>
    <div class="actions"><button class="primary" id="ok">Next</button></div></div>`;
  document.getElementById("ok").onclick = load;
}

// ---- Stats ----

async function statsView() {
  busy();
  const s = await api("/api/stats");
  const a = s.anki, t = s.totals;
  const tile = (v, label) => `<div class="tile"><b>${v}</b><span>${label}</span></div>`;
  app.innerHTML = `
    <div class="tiles top">${levelTile(s.level)}${tile((t.seconds / 3600).toFixed(1) + " h", "Spanish in all")}${tile(t.streak + " d", "streak")}</div>
    <h3>Level</h3><div class="chart" id="c-level"></div>
    <h3>Last 4 weeks</h3><div class="chart" id="c-days"></div>
    <h3>Anki</h3>
    <div class="tiles">${tile(a.introduced ?? 0, "introduced")}${tile(a.review ?? 0, "in review")}${tile(a.mature ?? 0, "mature")}
      ${tile(a.learning ?? 0, "learning")}${tile(a.due ?? 0, "due today")}${tile(a.recall == null ? "–" : Math.round(a.recall * 100) + "%", "recall")}</div>
    <h3>The path</h3><div class="chart" id="c-path"></div>
    ${s.errors.length ? `<h3>Talk: recurring errors</h3><div class="list">${s.errors.map(([k, n]) =>
      `<div class="row"><b>${esc(k)}</b><span>${n}×</span></div>`).join("")}</div>` : ""}
    <h3>Recent</h3>${s.recent.length ? `<div class="list">${s.recent.map(recentRow).join("")}</div>`
      : '<div class="empty">–</div>'}`;
  levelChart(document.getElementById("c-level"), s);
  daysChart(document.getElementById("c-days"), s.days);
  pathChart(document.getElementById("c-path"), s);
}

function recentRow(r) {
  const title = r.kind === "video" ? r.title : { talk: "Hablar", type: "Escribir" }[r.kind] || "Anki";
  return `<div class="row"><div><b>${esc(title || "")}</b><span>${shortDate(r.finished * 1000)} · ${mins(r.seconds)} min${r.boring ? " · boring" : ""}</span></div>
    ${r.rating && r.kind === "video" ? `<span class="rating ${r.rating}">${RATINGS[r.rating]}</span>` : ""}</div>`;
}

function svg(box, H) {
  const W = box.clientWidth - 20;
  const ns = "http://www.w3.org/2000/svg";
  const el = document.createElementNS(ns, "svg");
  el.setAttribute("viewBox", `0 0 ${W} ${H}`); el.style.height = H + "px";
  box.append(el);
  const add = (name, attrs) => { const e = document.createElementNS(ns, name);
    for (const k in attrs) e.setAttribute(k, attrs[k]); el.append(e); return e; };
  return { el, add, W, H };
}

function tooltip(box) {
  const tip = document.createElement("div"); tip.className = "tip"; box.append(tip);
  return { show(html, x, y) { tip.innerHTML = html; tip.style.opacity = 1;
      tip.style.left = Math.max(4, Math.min(x + 12, box.clientWidth - tip.offsetWidth - 4)) + "px";
      tip.style.top = Math.max(4, y - 44) + "px"; },
    hide() { tip.style.opacity = 0; } };
}

function levelAxis(add, y, x0, x1, lo, hi) {
  // A line where each CEFR band begins, labelled with the band.
  CEFR.forEach((name, k) => {
    const v = BAND_START + k;
    if (v < lo || v > hi) return;
    add("line", { x1: x0, x2: x1, y1: y(v), y2: y(v), stroke: "#262a36" });
    add("text", { x: x0 - 6, y: y(v) + 4, "text-anchor": "end" }).textContent = name;
  });
}

// The level over time, and what each conversation partner judged: comprehension and
// production of the learner's Spanish, on the same CEFR scale.
function levelChart(box, s) {
  const series = [["Your level", "var(--k-video)"], ["Comprehension", "var(--k-anki)"], ["Production", "var(--k-talk)"]];
  box.insertAdjacentHTML("beforeend", `<div class="legend">${series.map(([label, c]) =>
    `<span><i style="background:${c}"></i>${label}</span>`).join("")}</div>`);
  const now = Date.now() / 1000;
  const hist = s.level_history.length ? s.level_history : [{ at: now, level: s.level }];
  const line = [...hist, { at: now, level: s.level }];
  const marks = [];
  for (const a of s.assessments) {
    if (scoreOf(a.comprehension) !== null) marks.push({ at: a.at, v: scoreOf(a.comprehension), c: "var(--k-anki)" });
    if (scoreOf(a.production) !== null) marks.push({ at: a.at, v: scoreOf(a.production), c: "var(--k-talk)" });
  }
  const values = [...line.map(p => p.level), ...marks.map(p => p.v)];
  const { el, add, W, H } = svg(box, 170);
  const tip = tooltip(box);
  const m = { l: 34, r: 10, t: 10, b: 18 };
  const lo = Math.min(-0.5, ...values) - 0.2, hi = Math.max(1.2, ...values) + 0.3;
  const t0 = Math.min(...line.map(p => p.at), ...marks.map(p => p.at)), t1 = Math.max(now, t0 + 86400);
  const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = l => m.t + (1 - (l - lo) / (hi - lo)) * (H - m.t - m.b);
  levelAxis(add, y, m.l, W - m.r, lo, hi);
  add("text", { x: m.l, y: H - 4 }).textContent = shortDate(t0 * 1000);
  add("text", { x: W - m.r, y: H - 4, "text-anchor": "end" }).textContent = "today";
  add("path", { d: line.map((p, i) => `${i ? "L" : "M"}${x(p.at)},${y(p.level)}`).join(""), fill: "none",
    stroke: "var(--k-video)", "stroke-width": 2, "stroke-linejoin": "round" });
  for (const p of marks) {
    const dot = add("circle", { cx: x(p.at), cy: y(p.v), r: 5, fill: p.c, stroke: "var(--panel)", "stroke-width": 2 });
    dot.addEventListener("mouseenter", ev => { const r = box.getBoundingClientRect();
      tip.show(`${shortDate(p.at * 1000)} · ${cefr(p.v)}`, ev.clientX - r.left, ev.clientY - r.top); });
    dot.addEventListener("mouseleave", tip.hide);
  }
  add("circle", { cx: x(now), cy: y(s.level), r: 4.5, fill: "var(--k-video)", stroke: "var(--panel)", "stroke-width": 2 });
}

// Minutes per day, stacked by kind; tap or hover a day for its numbers.
function daysChart(box, days) {
  box.insertAdjacentHTML("beforeend", `<div class="legend">${KINDS.map(([, label, c]) =>
    `<span><i style="background:${c}"></i>${label}</span>`).join("")}</div>`);
  const { el, add, W, H } = svg(box, 150);
  const tip = tooltip(box);
  const m = { l: 30, r: 4, t: 8, b: 18 };
  const total = d => (d.video + d.anki + d.talk) / 60;
  const top = Math.max(15, ...days.map(total));
  const step = top > 90 ? 60 : top > 40 ? 30 : 15;
  const ymax = Math.ceil(top / step) * step;
  const bw = (W - m.l - m.r) / days.length;
  const y = v => m.t + (1 - v / ymax) * (H - m.t - m.b);
  for (let v = 0; v <= ymax; v += step) {
    add("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "#262a36" });
    add("text", { x: m.l - 5, y: y(v) + 4, "text-anchor": "end" }).textContent = v;
  }
  days.forEach((d, i) => {
    const x0 = m.l + i * bw + 1, w = Math.max(2, bw - 2);
    let base = 0;
    KINDS.forEach(([k, , c]) => {
      const v = d[k] / 60;
      if (v <= 0) return;
      // A 2px surface gap separates stacked segments.
      const gap = base ? 2 : 0;
      add("rect", { x: x0, y: y(base + v), width: w, height: Math.max(1, y(base) - y(base + v) - gap), fill: c, rx: 2 });
      base += v;
    });
    const last = i === days.length - 1;
    if ((days.length - 1 - i) % 7 === 0)
      add("text", { x: last ? W - m.r : x0 + w / 2, y: H - 4, "text-anchor": last ? "end" : "middle" })
        .textContent = shortDate(d.date);
    const hit = add("rect", { x: m.l + i * bw, y: m.t, width: bw, height: H - m.t - m.b, fill: "transparent" });
    const show = ev => { const r = box.getBoundingClientRect();
      tip.show(`<b>${shortDate(d.date, { weekday: "short", day: "numeric", month: "short" })}</b> · ${Math.round(total(d))} min<br>` +
        KINDS.map(([k, label]) => `${label} ${Math.round(d[k] / 60)}`).join(" · ") + (d.reviews ? ` · ${d.reviews} reviews` : ""),
        ev.clientX - r.left, ev.clientY - r.top); };
    hit.addEventListener("mousemove", show); hit.addEventListener("click", show);
  });
  el.addEventListener("mouseleave", tip.hide);
}

// Every unit from easy to hard, as wide as it is long; the dashed line is the learner.
function pathChart(box, s) {
  const total = s.path.reduce((a, [, d]) => a + d, 0) / 3600;
  const below = s.path.filter(([l]) => l <= s.level).reduce((a, [, d]) => a + d, 0) / 3600;
  const done = s.path.filter(([, , dn]) => dn).length;
  box.insertAdjacentHTML("beforeend", `<div class="legend"><span><i style="background:var(--good)"></i>done ${done}</span>
    <span><i style="background:#3a4050"></i>to do ${s.path.length - done}</span>
    <span>${below.toFixed(0)} of ${total.toFixed(0)} h at or below you</span></div>`);
  const { add, W, H } = svg(box, 160);
  const m = { l: 34, r: 10, t: 10, b: 18 };
  const lo = Math.min(-0.5, s.path[0][0]), hi = Math.max(3.5, s.path[s.path.length - 1][0]);
  const x = t => m.l + t / total * (W - m.l - m.r);
  const y = l => m.t + (1 - (l - lo) / (hi - lo)) * (H - m.t - m.b);
  levelAxis(add, y, m.l, W - m.r, lo, hi);
  let t = 0;
  for (const [l, d, dn] of s.path) {
    add("rect", { x: x(t), y: y(l) - 1.5, width: Math.max(0.8, x(t + d / 3600) - x(t)), height: 3,
      fill: dn ? "var(--good)" : "#3a4050" });
    t += d / 3600;
  }
  add("line", { x1: m.l, x2: W - m.r, y1: y(s.level), y2: y(s.level), stroke: "var(--accent)",
    "stroke-width": 1.5, "stroke-dasharray": "4 3" });
  add("text", { x: W - m.r, y: y(s.level) - 5, "text-anchor": "end", style: "fill: var(--accent)" }).textContent = "you";
  for (let hr = 0; hr <= total; hr += 100)
    add("text", { x: x(hr), y: H - 4, "text-anchor": hr ? "middle" : "start" }).textContent = hr + " h";
}

load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
</script>
</body>
