[project]
name = "spanish-immersion-path"
version = "0.1.0"
description = "Spanish immersion videos ordered easy to hard, with an Anki deck per video"
requires-python = ">=3.12"
dependencies = [
    "spacy>=3.8",
    "es_core_news_md @ https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl",
    "wordfreq>=3.1",
    "genanki>=0.13",
    "anki>=25.2",
    "piper-tts>=1.3",
    "yt-dlp[default,curl-cffi]",
    "punctuators>=0.0.7",
]
